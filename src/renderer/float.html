<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval';">
  <title>提醒事项 - 悬浮窗</title>
  <link rel="stylesheet" href="css/float.css">
</head>
<body>
  <div id="app">
    <div class="header">
      <span class="title">提醒事项</span>
      <span class="cnt">{{items.length}}</span>
      <button class="btn" title="最小化" @click="minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="btn" title="切换主题" @click="toggleTheme">
        <svg v-if="settings.theme==='light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="btn" title="隐藏" @click="hide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="list">
      <!-- 内联新建输入框 -->
      <div v-if="adding" class="add-row">
        <div class="add-empty-circle"></div>
        <input ref="addInput" v-model="newTitle" @keyup.enter="confirmAdd" @keyup.esc="cancelAdd" placeholder="输入标题，回车添加…" class="add-input">
        <button class="add-confirm" @click="confirmAdd">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
        <button class="add-cancel" @click="cancelAdd">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div v-if="items.length===0 && !adding" class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div>暂无待办提醒</div>
      </div>
      <div v-for="r in items" :key="r.id" class="item-wrap">
        <div class="item" :class="{expanded: expandedId===r.id && r.subtasks && r.subtasks.length}">
          <div class="ck" :class="{done:r.completed}" @click.stop="toggle(r.id)"></div>
          <div class="i-body" @click="r.subtasks && r.subtasks.length ? toggleExpand(r.id) : null">
            <div class="i-title">
              <span v-if="r.priority===1" class="i-prio p1"></span>
              <span v-else-if="r.priority===2" class="i-prio p2"></span>
              {{r.title}}
              <span v-if="r.subtasks && r.subtasks.length" class="expand-icon" :class="{open: expandedId===r.id}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </span>
            </div>
            <div v-if="r.due" class="i-due" :class="dueClass(r)">{{dueText(r)}}</div>
          </div>
        </div>
        <!-- 需求1: 展开的子任务列表 -->
        <div v-if="expandedId===r.id && r.subtasks && r.subtasks.length" class="subtasks-mini">
          <div v-for="s in r.subtasks" :key="s.id" class="subtask-mini" :class="{done:s.done}">
            <div class="sub-ck-mini" :class="{done:s.done}" @click.stop="toggleSub(r.id, s.id)"></div>
            <span class="sub-title-mini">{{s.title}}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <button class="fb" @click="startAdd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>新建</span>
      </button>
      <button class="fb" @click="showMain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>打开主窗口</span>
      </button>
    </div>
  </div>

  <script src="lib/vue.global.prod.js"></script>
  <script src="js/util.js"></script>
  <script src="js/float-app.js"></script>
</body>
</html>
